# Kamerton tesla: the scarlet tesla ball the Kamerton reactor leaves behind when it collapses.
# Twice the size of a normal tesla ball, scarlet arcs, tentacle bursts, offspring; singularities cannot eat it.

- type: entity
  id: KamertonTesla
  parent: TeslaEnergyBall
  name: Kamerton tesla
  description: A scarlet ball of energy twice the size of a tesla orb. Lightning tentacles whip out of it far across the station.
  components:
  - type: Fixtures
    fixtures:
      EventHorizonCollider:
        shape:
          !type:PhysShapeCircle
            radius: 1.1
        hard: true
        restitution: 0.8
        density: 99999
        mask:
        - Opaque
        layer:
        - GlassLayer
      EventHorizonConsumer:
        shape:
          !type:PhysShapeCircle
            radius: 1.3
        hard: false
        mask:
        - Opaque
        layer:
        - GlassLayer
  - type: EventHorizon
    radius: 1
    canBreachContainment: false
    colliderFixtureId: EventHorizonCollider
    consumerFixtureId: EventHorizonConsumer
    consumeTiles: false
    consumeEntities: false
  - type: Sprite
    drawdepth: Effects
    sprite: _CorvaxGoob/Structures/Power/Generation/kamerton_tesla.rsi
    scale: 2, 2
    layers:
    - state: energy_ball
      shader: unshaded
  - type: PointLight
    enabled: true
    radius: 14
    energy: 16
    color: "#FF2400"
  - type: LightningArcShooter
    arcDepth: 3
    maxLightningArc: 4
    shootMinInterval: 3
    shootMaxInterval: 5
    shootRange: 7
    lightningPrototype: KamertonScarletLightning
  - type: WarpPoint
    follow: true
    location: Kamerton tesla
  - type: KamertonTesla

- type: entity
  id: KamertonScarletLightning
  parent: Lightning
  name: scarlet lightning
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _CorvaxGoob/Effects/kamerton_scarlet_lightning.rsi
    drawdepth: Effects
    layers:
    - state: "lightning_1"
      shader: unshaded
  - type: PointLight
    enabled: true
    color: "#FF2400"
    radius: 3.5
    softness: 1
    autoRot: true
    castShadows: false

# One segment of a lightning tentacle. It touches mobs along its path and gives them a light shock.
- type: entity
  id: KamertonTeslaTentacle
  name: lightning tentacle
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _CorvaxGoob/Effects/kamerton_scarlet_lightning.rsi
    drawdepth: Effects
    layers:
    - state: "lightning_1"
      shader: unshaded
  - type: Physics
    canCollide: false
  - type: Electrified
    requirePower: false
    shockDamage: 5
    shockTime: 1
  - type: PointLight
    enabled: true
    color: "#FF2400"
    radius: 2.5
    softness: 1
    autoRot: true
    castShadows: false
  - type: Beam
  - type: TimedDespawn
    lifetime: 0.8
  - type: Tag
    tags:
    - HideContextMenu

# Invisible anchor point a tentacle segment is stretched between.
- type: entity
  id: KamertonTeslaTentacleNode
  name: lightning tentacle node
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 2.5
