# Meltdown arcs: thin red and blue lightning running from the core, drawn like Gilbert's phase-2 bolts.
- type: entity
  id: KamertonArcFxBase
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _CorvaxGoob/Effects/kamerton_arc.rsi
    drawdepth: Effects
    noRot: false
  - type: TimedDespawn
    lifetime: 0.16
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  id: KamertonArcSegmentRed
  parent: KamertonArcFxBase
  name: red arc
  components:
  - type: Sprite
    layers:
    - state: bolt_red
      shader: unshaded

- type: entity
  id: KamertonArcSegmentBlue
  parent: KamertonArcFxBase
  name: blue arc
  components:
  - type: Sprite
    layers:
    - state: bolt_blue
      shader: unshaded

- type: entity
  id: KamertonArcCrawlRed
  parent: KamertonArcFxBase
  name: red crackle
  components:
  - type: Sprite
    noRot: true
    layers:
    - state: crawl_red
      shader: unshaded
  - type: PointLight
    color: "#ff4040"
    radius: 1.4
    energy: 1.4
    castShadows: false
  - type: TimedDespawn
    lifetime: 0.3

- type: entity
  id: KamertonArcCrawlBlue
  parent: KamertonArcFxBase
  name: blue crackle
  components:
  - type: Sprite
    noRot: true
    layers:
    - state: crawl_blue
      shader: unshaded
  - type: PointLight
    color: "#4080ff"
    radius: 1.4
    energy: 1.4
    castShadows: false
  - type: TimedDespawn
    lifetime: 0.3

# Flatpacker boards («упаковщик 1001»). Printed at the circuit imprinter after the «Камертон» research;
# the flatpacker turns each one into the ready flatpack. Costs are material units (100 per sheet).

- type: entity
  parent: BaseElectronics
  id: KamertonReactorCoreFlatpackBoard
  name: Kamerton reactor core flatpack board
  description: A circuit board for the flatpacker. It packs a Kamerton reactor core; machine frames do not take it.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    state: engineering
  - type: KamertonFlatpackBoard
    flatpack: KamertonReactorCoreFlatpack
    entity: KamertonReactorCore
    cost:
      Steel: 3000
      Plasteel: 1500
      Gold: 1000
      Plasma: 1000
  - type: StaticPrice
    price: 300

