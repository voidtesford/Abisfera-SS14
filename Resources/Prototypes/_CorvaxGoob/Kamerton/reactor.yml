# Kamerton reactor. Parts link up like the AME shielding: every part has an AdjacentNode on the
# KamertonReactor node group, so anchored parts side by side (N/E/S/W) form one reactor around its core.
# Any shape works as long as every inner part (core, arrays, synchronizers, radiators) has all 8 neighbours
# taken by reactor parts, i.e. the inner parts are walled in by shell parts: suppressors, the console, the
# power unit and the heat sinks. Each fuel array pairs with a synchronizer next to it.
# Heat path: core/arrays -> radiators -> heat sinks -> gas. A radiator only carries heat away when a chain
# of radiators links it to a heat sink (heat pipes); unlinked radiators only buffer heat.
# The standard layout: two parallel lines on each side, radiators inside, heat sinks on the edge. The heat
# sink columns are pipes (inlet north, outlet south) that leave the reactor at the top and bottom.
#   H  Q  F  K  Q  Q  H
#   H  R  A+ Y  A- R  H
#   H  R  A- Y  A+ R  H
#   H  R  R  C  R  R  H
#   H  R  A+ Y  A- R  H
#   H  R  A- Y  A+ R  H
#   H  Q  Q  P  Q  Q  H
# C core, Y synchronizer, A+/A- stable/unstable fuel array, H heat sink, R radiator,
# Q suppressor, K control module, P power unit, F fuel storage (a shell part next to the console;
# the RDZT drone that comes out of the core flatpack refuels the arrays from it).

- type: entity
  abstract: true
  parent: BaseStructure
  id: KamertonReactorPartBase
  components:
  - type: Sprite
    sprite: _CorvaxGoob/Structures/Power/Generation/kamerton_reactor.rsi
    snapCardinals: true
    noRot: true
  - type: Transform
    anchored: true
    noRot: true
  - type: Anchorable
  - type: Appearance
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallicStrong
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 2
            max: 4
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: StaticPrice
    price: 2000

