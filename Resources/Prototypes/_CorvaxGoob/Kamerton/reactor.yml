    - state: core
    - state: core_on
      map: [ "enum.KamertonReactorVisualLayers.On" ]
      shader: unshaded
      visible: false
    - state: core_heat_1
      map: [ "enum.KamertonReactorVisualLayers.Heat" ]
      shader: unshaded
      visible: false
  - type: GenericVisualizer
    visuals:
      enum.KamertonReactorVisuals.On:
        enum.KamertonReactorVisualLayers.On:
          True: { visible: true }
          False: { visible: false }
      enum.KamertonReactorVisuals.Heat:
        enum.KamertonReactorVisualLayers.Heat:
          0: { visible: false }
