    sprite: _CorvaxGoob/Structures/Power/Generation/kamerton_reactor.rsi
    drawdepth: Objects
    snapCardinals: true
    noRot: true
  - type: Transform
    anchored: true
    noRot: true
  - type: Anchorable
  - type: Appearance
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallicStrong
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 2
            max: 4
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: StaticPrice
    price: 2000

- type: entity
