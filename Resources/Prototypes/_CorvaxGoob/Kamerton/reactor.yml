# SZK («СЗК», Kamerton refuelling system): a shell part. Anchored in the shell of an assembled reactor it lays
# a rail lattice over the whole reactor and runs a manipulator carriage on it between the fuel storage and the
# arrays. The arrays are walled in, so a reactor without an SZK cannot be refuelled.
- type: entity
  parent: KamertonReactorPartBase
  id: KamertonSzk
  name: SZK
  description: The Kamerton refuelling system. Built into the reactor shell, it lays a rail lattice over the reactor; a manipulator carriage carries cells between the fuel storage and the arrays.
  components:
  - type: Sprite
    layers:
    - sprite: _CorvaxGoob/Structures/Power/Generation/kamerton_hull.rsi
      state: hull_ne_0
