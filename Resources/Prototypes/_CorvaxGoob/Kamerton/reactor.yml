    layers:
    - sprite: _CorvaxGoob/Structures/Power/Generation/kamerton_hull.rsi
      state: hull_ne_0
      map: [ "enum.KamertonReactorVisualLayers.HullNE" ]
    - sprite: _CorvaxGoob/Structures/Power/Generation/kamerton_hull.rsi
      state: hull_se_0
