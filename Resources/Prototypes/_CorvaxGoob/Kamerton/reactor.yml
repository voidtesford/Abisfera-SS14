  name: RDZT
  description: Kamerton refuelling maintenance drone, a spider-like service robot. It docks at the fuel storage and swaps the cells in the fuel arrays through the hull. It never strays far from the core.
  components:
  - type: Sprite
    sprite: _CorvaxGoob/Mobs/Silicon/kamerton_drone.rsi
    layers:
    - state: idle
      map: [ "enum.KamertonDroneVisualLayers.Base" ]
    - state: eyes
      shader: unshaded
  - type: GenericVisualizer
    visuals:
      enum.KamertonDroneVisuals.Moving:
        enum.KamertonDroneVisualLayers.Base:
          True: { state: walk }
          False: { state: idle }
  - type: Appearance
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.3
        density: 60
        mask:
        - SmallMobMask
        layer:
        - SmallMobLayer
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: PointLight
    radius: 1.2
    energy: 0.6
    color: "#39C6FF"
  - type: KamertonDrone
  - type: StaticPrice
    price: 1500

