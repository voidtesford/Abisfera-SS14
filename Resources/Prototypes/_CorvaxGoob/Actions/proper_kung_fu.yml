- type: entity
  parent: BaseAction
  id: ActionProperKungFuWolfDance
  name: Wolf Dance
  description: "Dash fast straight through a target up to 5 tiles away without bumping into it, stopping about a tile past it and staying on your feet. The target takes 20 Blunt to the body and is tossed into the air on the spot, landing knocked down (2 s stun). A held shield blocks the hit but gets knocked out of the hands. Right after a Claw Series the same dash hits much harder and sends the target further, only knocking them down; right after a Claw Whirlwind an even faster dash sends the target 5 tiles. You stay on your feet in every case. If a living target already had at least 85 damage, the plain dash turns into a finisher: 10 more fast dashes through the locked target, each turned 90 degrees (5 Blunt to the body and a toss each), then a final strike for 30 Slash to the head, torso, arms and legs that throws the target 7 tiles. Any Wolf Dance hit marks the target for the Hammer for 2 seconds. A finisher heals you for 25."
  components:
  - type: Action
    useDelay: 20
    itemIconStyle: BigAction
    icon:
      sprite: _CorvaxGoob/Interface/Actions/proper_kung_fu.rsi
      state: wolf_dance
  - type: TargetAction
    range: 5
    interactOnMiss: false
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - MobState
    event: !type:WolfDanceActionEvent
      damage:
        types:
          Blunt: 20
      stunTime: 2
      knockbackDistance: 3
      knockbackSpeed: 10
      maxRange: 5.5
      # Plain: a fast dash through the target, which is tossed up in place; the user stays up.
      # Synergy variants: one straight flying kick, feet first; the user lands on the floor after it.
      passThroughDistance: 1
      passThroughDashDuration: 0.12
      tossDuration: 0.6
      tossHeight: 0.9
      tossSpins: 1
      plainUserFalls: false
      # Plain finisher: the target had >= 85 damage before the dance.
      finisherThreshold: 85
      finisherPasses: 10
      finisherPassDistance: 3
      finisherPassDuration: 0.16
      finisherPassDamage:
        types:
          Blunt: 5
      finisherPassEffect: ProperKungFuFlowFlash
      finisherPassSound:
        path: /Audio/Weapons/punch3.ogg
        params:
          volume: -2
      finisherTossDuration: 0.3
      finisherTossHeight: 0.5
      finisherFinalDamage:
        types:
          Slash: 30
      finisherKnockbackDistance: 7
      finisherKnockbackSpeed: 14
      finisherKnockdownTime: 3
      finisherFinalEffect: ProperKungFuDanceFinisherFlash
      finisherFinalSound:
        path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
        params:
          volume: 4
      dashDuration: 0.12
      userKnockdownTime: 1.5
      kickRange: 1.5
      # Kick on a target marked by Claw Series in the last 2 s.
      synergyDamage:
        types:
          Blunt: 30
      synergyKnockbackDistance: 5
      synergyKnockdownTime: 2
      # Kick on a target hit by Claw Whirlwind in the last 2 s (wins over the Claw Series mark):
      # a faster flying kick, the target flies 5 tiles and falls.
      whirlwindSynergyDamage:
        types:
          Blunt: 15
          Slash: 15
      whirlwindKnockbackDistance: 5
      whirlwindDashDuration: 0.07
      whirlwindKnockdownTime: 2
      # Only the kick (stock hit_kick) and the shield block make a sound; no flight / miss whooshes.
      hitSound:
        path: /Audio/Effects/hit_kick.ogg
      blockedSound:
        path: /Audio/Weapons/block_metal1.ogg

- type: entity
  parent: BaseAction
  id: ActionProperKungFuClawWhirlwind
  name: Claw Whirlwind
  description: Throw a target within fist reach over yourself, drive your knee into their jaw (breaks the skull and shakes the brain), and they slowly spin up into the air before crashing down. The target can't move for about 2 seconds. Shields don't help. A Wolf Dance right after it becomes an even faster dash that sends the target 5 tiles away. If a living target already had at least 80 damage, a huge ascending and then descending claw slash (90 Slash to the torso each) hits them in the air and slams them into the floor (knocked down 4 seconds). Used on a target right after a Wolf Grip it becomes a two-handed cross strike instead.
  components:
  - type: Action
    useDelay: 30
    itemIconStyle: BigAction
    icon:
      sprite: _CorvaxGoob/Interface/Actions/proper_kung_fu.rsi
      state: claw_whirlwind
  - type: TargetAction
    # Client-side hint only; the server checks the user's fist range.
    range: 1.5
    interactOnMiss: false
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - MobState
    event: !type:ClawWhirlwindActionEvent
      damage:
        types:
          Blunt: 10
      flipDistance: 0.9
      flipDuration: 0.5
      airDuration: 1
      landHold: 0.5
      launchHeight: 0.8
      spins: 2
      knockdownTime: 2
      markDuration: 2
      brainTraumaSeverity: 6
      impactEffect: ProperKungFuKneeBurst
      flipSound:
        path: /Audio/Effects/thudswoosh.ogg
      kneeSound:
        path: /Audio/Weapons/genhit2.ogg
      landSound:
        path: /Audio/Effects/thudswoosh.ogg
      # Wolf Grip synergy: two-handed cross strike instead of the throw.
      gripStrikeDamage:
        types:
          Blunt: 20
          Slash: 10
      gripLungDamageFraction: 0.4
      gripBreathBlockTime: 60
      gripKnockbackDistance: 8
      gripKnockbackSpeed: 10
      gripKnockdownTime: 10
      gripImpactEffect: ProperKungFuCrossSlash
      gripSound:
        path: /Audio/Weapons/genhit3.ogg
      # Plain finisher: the target had >= 80 damage before the whirlwind.
      finisherThreshold: 80
      finisherSlashDamage:
        types:
          Slash: 90
      finisherUpDelay: 0.4
      finisherDownDelay: 0.75
      finisherKnockdownTime: 4
      finisherUpEffect: ProperKungFuWhirlwindFinisherUp
      finisherDownEffect: ProperKungFuWhirlwindFinisherDown
      finisherImpactEffects:
      - ProperKungFuWhirlwindSlamCrack
      - ProperKungFuShockwaveEffect
      - ProperKungFuDustPuffWhite
      - ProperKungFuDustPuffRed
      finisherUpSound:
        path: /Audio/Weapons/Xeno/alien_claw_flesh1.ogg
        params:
          volume: 4
      finisherDownSound:
        path: /Audio/Weapons/Xeno/alien_claw_flesh2.ogg
        params:
          volume: 4
      finisherSlamSound:
        path: /Audio/Effects/metal_slam5.ogg

- type: entity
  parent: BaseAction
  id: ActionProperKungFuHammer
  name: Hammer
  description: "One sweeping downward claw strike into the head of a target within fist reach (15 Blunt, eyes and brain lose 30 percent). The target is floored and can't get up for 5 seconds. Right after a Wolf Grip it deals 20 Blunt to the head and you backflip away, and a Wolf Dance within 2 seconds becomes an instant dash into the target. Within 2 seconds after a Wolf Dance hit it deals 20 Blunt to the body and sends the target exactly 5 tiles away. If a living target already had at least 80 damage, it becomes a finisher on the locked target: a light claw strike (1 damage), a straight strike (5 Blunt to the torso) that pushes them 2 tiles, a front flip into another strike (5 Blunt to the torso), and a spinning claw strike across the head (50 Blunt) that spins them sideways and lands them knocked down 5 tiles from you, then you dash at them wherever they landed and slash them with a cross of claws (90 Slash to the torso, ignoring armor); the skull is never broken and the finisher heals you for 25. A target that was already lying takes 50 Blunt to the head, is paralyzed for 10 seconds and is disoriented as long."
  components:
  - type: Action
    useDelay: 20
    itemIconStyle: BigAction
    icon:
      sprite: _CorvaxGoob/Interface/Actions/proper_kung_fu.rsi
      state: hammer
  - type: TargetAction
    # Client-side hint only; the server checks the user's fist range.
    range: 1.5
    interactOnMiss: false
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - MobState
    event: !type:HammerActionEvent
      damage:
        types:
          Blunt: 15
      knockdownTime: 5
      eyeDamageFraction: 0.3
      brainDamageFraction: 0.3
      lyingDamage:
        types:
          Blunt: 50
      lyingStunTime: 10
      gripDamage:
        types:
          Blunt: 20
      backflipDistance: 1
      backflipDuration: 0.35
      danceWindow: 2
      impactEffect: ProperKungFuHammerStrike
      gripImpactEffect: ProperKungFuHammerUpStrike
      hitSound:
        path: /Audio/Weapons/genhit3.ogg
      # On a target hit by Wolf Dance in the last 2 s: 20 Blunt to the body, 5 tile knockback, no trauma/sleep.
      danceDamage:
        types:
          Blunt: 20
      danceKnockbackDistance: 5
      danceKnockbackSpeed: 10
      danceKnockdownTime: 1.5
      # Finisher on a living target with at least 80 damage: four strikes, the last throws the target 5 tiles.
      finisherThreshold: 80
      finisherFirstDamage:
        types:
          Blunt: 1
      finisherStraightDamage:
        types:
          Blunt: 5
      finisherFlipDamage:
        types:
          Blunt: 5
      finisherSpinDamage:
        types:
          Blunt: 50

- type: entity
  parent: BaseAction
  id: ActionProperKungFuWolfInstinct
  name: Wolf Instinct
  description: For 3 seconds you take a counter stance. Every melee attack on you is parried and answered with a two-palm strike into the attacker's chest (25 Slash, 75 stamina damage); they fly back 3 tiles but stay on their feet. If a gun hurts you, you dash at the shooter up to 8 tiles and, if you reach them, knock them down, knock the gun out of their hands and take them into a hard grab without hurting them; a shooter further away is missed. Thrown objects don't hurt you and fly back at the thrower twice as fast.
  components:
  - type: Action
    useDelay: 30
    itemIconStyle: BigAction
    icon:
      sprite: _CorvaxGoob/Interface/Actions/proper_kung_fu.rsi
      state: wolf_instinct
  - type: InstantAction
    event: !type:WolfInstinctActionEvent
      duration: 3
      cancelMeleeDamage: true
      allowMultipleCounters: true
      counterDamage:
        types:
          Slash: 25
      counterStaminaDamage: 75
      counterKnockbackDistance: 3
      counterKnockbackSpeed: 10
      counterEffect: ProperKungFuInstinctClawSlash
      # Finisher on an attacker that already has 85+ damage: 6 claw slashes while travelling 3 tiles, then a cross strike.
      finisherThreshold: 85
      finisherSlashes: 6
      finisherSlashInterval: 0.2
      finisherSlashDamage:
        types:
          Slash: 1
      finisherTravelDistance: 3
      finisherCrossDamage:
        types:
          Slash: 100
      finisherKnockbackDistance: 10
      finisherKnockbackSpeed: 20
      finisherKnockdownTime: 3
      finisherSlashEffect: ProperKungFuInstinctClawSlash
      finisherCrossEffect: ProperKungFuInstinctFinisherCross
      finisherSlashSound:
        path: /Audio/Weapons/bladeslice.ogg
      finisherCrossSound:
        path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
        params:
          volume: 4
      counterSound:
        path: /Audio/Weapons/boxingpunch1.ogg
      dashRange: 8
      dashSpeed: 24
      dashReach: 1.5
      shooterKnockdownTime: 3
      gunEndsStance: true
      dashHitSound:
        path: /Audio/Weapons/genhit2.ogg
      afterimageEffect: ProperKungFuDashAfterimage
      blockThrownDamage: true
      reflectSpeedMultiplier: 2
      reflectSound:
        path: /Audio/Weapons/punchmiss.ogg
      auraEffect: ProperKungFuInstinctAura
      auraPulseEffect: ProperKungFuInstinctAuraPulse
      auraFadeEffect: ProperKungFuInstinctAuraFade
      # Loud ringing stomp: a heavy metal slam plus a long clang (stock sounds).
      stanceSound:
        path: /Audio/Effects/metal_slam5.ogg
        params:
          volume: 6
      stanceRingSound:
        path: /Audio/Effects/clang.ogg
        params:
          volume: 4

- type: entity
  parent: BaseAction
  id: ActionProperKungFuWolfPack
  name: Wolf Pack
  description: "Call 1 to 3 wolves in your own image out of white-red smoke around you for 30 seconds. They wear harmless copies of your clothes, know Proper Kung Fu without its passives, have 20 health, deal a quarter of the damage and use a skill at most once every 5 seconds. They go for the chosen target, for whoever attacks you and for whoever you attack, and never touch you or each other. When slain or when time runs out they vanish in red smoke and leave nothing behind."
  components:
  - type: Action
    useDelay: 80
    itemIconStyle: BigAction
    icon:
      sprite: _CorvaxGoob/Interface/Actions/proper_kung_fu.rsi
      state: wolf_pack
  - type: TargetAction
    range: 10
    interactOnMiss: false
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - MobState
    event: !type:WolfPackActionEvent
      minClones: 1
      maxClones: 3
      lifetime: 30
      cloneHealth: 20
      damageModifier: 0.25
      spawnEffect: ProperKungFuWolfPackSmoke
      vanishEffect: ProperKungFuWolfPackVanish
      sound:
        path: /Audio/Effects/smoke.ogg

- type: entity
  parent: BaseAction
  id: ActionProperKungFuKunai
  name: Kunai
  description: "Summon a kunai into your hand out of white-red smoke. It cuts like a combat knife (15 Slash) and flies twice as fast as a normal throw. Thrown, it sticks into whatever it hits (15 Slash to a body), and wherever it lands or sticks you teleport to it in a puff of smoke and the kunai is gone. A hit on a living target that already has at least 80 damage starts a kunai finisher instead (heals you for 25): in melee a kick, a kunai to the neck that drains all blood and the one-inch death punch; thrown, ten crimson doubles throw their kunai and vanish, you dash through the target leaving a wide crescent slash on it, turn, backflip and a volley of ten kunai flies in. Only one summoned kunai exists at a time; an unused one fades after 60 seconds. Allowed despite the ban on ranged weapons."
  components:
  - type: Action
    useDelay: 10
    itemIconStyle: BigAction
    icon:
      sprite: _CorvaxGoob/Interface/Actions/proper_kung_fu.rsi
      state: kunai
  - type: InstantAction
    event: !type:KunaiActionEvent
      kunai: ProperKungFuKunai
      smokeEffect: ProperKungFuWolfPackSmoke
      lifetime: 60

- type: entity
  parent: BaseAction
  id: ActionProperKungFuJoinPack
  name: Join the Pack
  description: Spend 10 seconds teaching another person next to you. Moving or taking damage interrupts it. They learn Proper Kung Fu (pupil) - Claw Series, Wolf Grip and a torso-only Perfect Flow - with the same damage but weaker effects and none of the skills, passives, finishers, synergies or Claw Mastery; unlike the master, they can still use guns. Does not work on someone who already knows a martial art.
  components:
  - type: Action
    useDelay: 60
    itemIconStyle: BigAction
    icon:
      sprite: _CorvaxGoob/Interface/Actions/proper_kung_fu.rsi
      state: join_pack
  - type: TargetAction
    range: 1.5
    interactOnMiss: false
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - HumanoidAppearance
    event: !type:JoinPackActionEvent
      delay: 10

- type: entity
  parent: BaseAction
  id: ActionProperKungFuUltimate
  name: Claw Mastery
  description: "With a full Claw Mastery bar, enter the Claw Mastery mode for 4 minutes: your eyes burn red and a crimson aura surrounds you, and your skills are replaced by Twenty Shadows, Summon the Dogs, Wolf Judgment, Wolf Gaze, Wolf Seal and the fan kunai, your fists strike 2.5 times as fast (instead of 1.5) and every combo shortens to 2 inputs: Claw Series Harm, Harm; Wolf Grip Disarm, Grab; Perfect Flow Disarm, Harm. The bar fills from fighting; if you fall into crit with a full bar, 5 seconds later you get up fully healed in the mode."
  components:
  - type: Action
    useDelay: 1
    itemIconStyle: BigAction
    icon:
      sprite: _CorvaxGoob/Interface/Actions/proper_kung_fu.rsi
      state: ultimate
  - type: InstantAction
    event: !type:ProperKungFuUltimateActionEvent

# Ultimate-only: 20 shadows (one every 0.5 s) on the first use in a mode, 5 more on every later use; each lives 60 s.
- type: entity
  parent: BaseAction
  id: ActionProperKungFuUltimateClones
  name: Twenty Shadows
  description: "Howl and call twenty fragile copies of yourself out of smoke, one every half second. Each has 5 health and a random weapon (kunai, katana, monk staff, combat knife or bare hands), knows no martial art and attacks every living thing nearby except you and your Pack Dogs. Every later use in the same Claw Mastery mode calls 5 more. Each copy lives 60 seconds; all of them vanish when the mode ends."
  components:
  - type: Action
    useDelay: 60
    itemIconStyle: BigAction
    icon:
      sprite: _CorvaxGoob/Interface/Actions/proper_kung_fu.rsi
      state: ultimate_clones
  - type: InstantAction
    event: !type:ProperKungFuUltimateClonesActionEvent
      count: 20
      reuseCount: 5
      perSecond: 5
      firstInterval: 0.5
      cloneHealth: 5
      cloneLifetime: 60
      sound:
        path: /Audio/_DV/Voice/Vulpkanin/howl.ogg

# Ultimate-only: the 2 nearest able Pack Dogs to the user's sides.
- type: entity
  parent: BaseAction
  id: ActionProperKungFuSummonPack
  name: Summon the Dogs
  description: "Teleport up to 2 of your nearest living, conscious and uncuffed Pack Dogs (pupils) to your sides in white-red smoke. They hear your call: \"Tear apart those the alpha points at\". If nobody can come, the skill is not spent."
  components:
  - type: Action
    useDelay: 30
    itemIconStyle: BigAction
    icon:
      sprite: _CorvaxGoob/Interface/Actions/proper_kung_fu.rsi
      state: summon_pack
  - type: InstantAction
    event: !type:ProperKungFuSummonPackActionEvent
      maxPupils: 2

# Ultimate-only: a jump and a big claw cross over 3x6 tiles towards the cursor (2 x 20 Slash, knockdown).
# The first use with a hit in each mode adds the dash and the full combo (120 Slash to the chest, 20 tiles away).
- type: entity
  parent: BaseAction
  id: ActionProperKungFuWolfJudgment
  name: Wolf Judgment
  description: "Leap and rake a huge claw cross over a 3 by 6 tile area towards the cursor: two cuts of 20 Slash each to everyone in it (never you, your shadows or your Pack Dogs), knocking them all down. The first time it hits in each Claw Mastery mode, you also dash to the nearest victim: a red flurry of 10 claw strikes from every side of the star, a black-and-white barrage of 12 afterimage blows, and a double palm to the chest (120 Slash in all) that throws them 20 tiles away. Every later use in the same mode is only the claw cross."
  components:
  - type: Action
    useDelay: 60
    itemIconStyle: BigAction
    icon:
      sprite: _CorvaxGoob/Interface/Actions/proper_kung_fu.rsi
      state: wolf_judgment
  - type: TargetAction
    checkCanAccess: false
    range: 30
  - type: WorldTargetAction
    event: !type:ProperKungFuWolfJudgmentActionEvent

- type: entity
  parent: BaseAction
  id: ActionProperKungFuWolfGaze
  name: Wolf Gaze
  description: "Claw Mastery counter. For 3 seconds you watch for an attack: the first attack on you from within 3 tiles (melee, thrown or shot) is blocked, both of you freeze, and after a few seconds of tension you strike the attacker in the chest for 150 Blunt, throwing them 10 tiles away. Never triggers on your Pack Dogs or shadows. A successful counter can happen only once per Claw Mastery mode; if nobody attacks, the use is not spent and the skill recharges for 2 minutes instead."
  components:
  - type: Action
    useDelay: 30
    itemIconStyle: BigAction
    icon:
      sprite: _CorvaxGoob/Interface/Actions/proper_kung_fu.rsi
      state: wolf_gaze
  - type: InstantAction
    event: !type:ProperKungFuWolfGazeActionEvent

# CorvaxGoob-ProperKungFu v13: Claw Mastery "Wolf Seal".
- type: entity
  parent: BaseAction
  id: ActionProperKungFuWolfSeal
  name: Wolf Seal
  description: "Claw Mastery skill. Dash to a target up to 3 tiles away and uppercut it (10 Blunt), then drive both palms into its chest (2 x 10 Blunt) and throw it 5 tiles. The target can't breathe for 20 seconds (until death) and is knocked down, stunned and disoriented for 5 seconds. Not limited per Claw Mastery mode."
  components:
  - type: Action
    useDelay: 40
    itemIconStyle: BigAction
    icon:
      sprite: _CorvaxGoob/Interface/Actions/proper_kung_fu.rsi
      state: wolf_seal
  - type: TargetAction
    range: 3
    interactOnMiss: false
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - MobState
    event: !type:ProperKungFuWolfSealActionEvent
      maxRange: 3.5

# CorvaxGoob-ProperKungFu v13: Claw Mastery fan kunai (replaces Kunai during the mode, same 10 s cooldown).
- type: entity
  parent: BaseAction
  id: ActionProperKungFuFanKunai
  name: Fan Kunai
  description: "Claw Mastery kunai. Summon a crimson kunai into your hand. Thrown, it splits into five kunai fanned out ahead of you (-30, -15, 0, +15 and +30 degrees), each as fast and as sharp as a normal thrown kunai (15 Slash, 2 second stun). None of them pulls you to it or starts a kunai finisher, and every one of them is gone after it hits or lands. In melee it is a normal kunai."
  components:
  - type: Action
    useDelay: 10
    itemIconStyle: BigAction
    icon:
      sprite: _CorvaxGoob/Interface/Actions/proper_kung_fu.rsi
      state: ultimate_kunai
  - type: InstantAction
    event: !type:KunaiActionEvent
      kunai: ProperKungFuFanKunai
      smokeEffect: ProperKungFuWolfPackSmoke
      lifetime: 60
