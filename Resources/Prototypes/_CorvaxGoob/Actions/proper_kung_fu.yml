- type: entity
  parent: BaseAction
  id: ActionProperKungFuWolfDance
  name: Wolf Dance
  description: Dash to a target up to 5 tiles away and finish with a roundhouse kick that knocks them down and sends them flying. A held shield blocks the kick but gets knocked out of the hands.
  components:
  - type: Action
    useDelay: 20
    itemIconStyle: BigAction
    icon:
      sprite: _Goobstation/Actions/kravmaga.rsi
      state: legsweep
  - type: TargetAction
    range: 5
    interactOnMiss: false
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - MobState
    event: !type:WolfDanceActionEvent
      damage:
        types:
          Blunt: 20
      stunTime: 2
      knockbackDistance: 3
      knockbackSpeed: 10
      maxRange: 5.5
      dashSound:
        path: /Audio/Weapons/punchmiss.ogg
      hitSound:
        path: /Audio/Effects/hit_kick.ogg
      blockedSound:
        path: /Audio/Weapons/block_metal1.ogg
