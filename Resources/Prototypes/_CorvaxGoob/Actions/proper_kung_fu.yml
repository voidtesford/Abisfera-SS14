- type: entity
  parent: BaseAction
  id: ActionProperKungFuWolfDance
  name: Wolf Dance
  description: Leap feet first in a straight flying kick into a target up to 5 tiles away. The kick knocks them down and sends them flying, and you land on the floor after it. A held shield blocks the kick but gets knocked out of the hands. Right after a Claw Series the kick hits much harder and sends the target further, but only knocks them down. Right after a Claw Whirlwind the flying kick is faster and the target flies 5 tiles.
  components:
  - type: Action
    useDelay: 20
    itemIconStyle: BigAction
    icon:
      sprite: _CorvaxGoob/Interface/Actions/proper_kung_fu.rsi
      state: wolf_dance
  - type: TargetAction
    range: 5
    interactOnMiss: false
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - MobState
    event: !type:WolfDanceActionEvent
      damage:
        types:
          Blunt: 20
      stunTime: 2
      knockbackDistance: 3
      knockbackSpeed: 10
      maxRange: 5.5
      # One straight flying kick, feet first; the user lands on the floor after it in every variant.
      dashDuration: 0.35
      userKnockdownTime: 1.5
      kickRange: 1.5
      # Kick on a target marked by Claw Series in the last 2 s.
      synergyDamage:
        types:
          Blunt: 30
      synergyKnockbackDistance: 5
      synergyKnockdownTime: 2
      # Kick on a target hit by Claw Whirlwind in the last 2 s (wins over the Claw Series mark):
      # a faster flying kick, the target flies 5 tiles and falls.
      whirlwindSynergyDamage:
        types:
          Blunt: 15
          Slash: 15
      whirlwindKnockbackDistance: 5
      whirlwindDashDuration: 0.2
      whirlwindKnockdownTime: 2
      # Only the kick (stock hit_kick) and the shield block make a sound; no flight / miss whooshes.
      hitSound:
        path: /Audio/Effects/hit_kick.ogg
      blockedSound:
        path: /Audio/Weapons/block_metal1.ogg

- type: entity
  parent: BaseAction
  id: ActionProperKungFuClawWhirlwind
  name: Claw Whirlwind
  description: Throw a target within fist reach over yourself, drive your knee into their jaw (breaks the skull and shakes the brain), and they slowly spin up into the air before crashing down. The target can't move for about 2 seconds. Shields don't help. A Wolf Dance right after it becomes a single fast dash that sends the target 5 tiles away, but you fall too. Used on a target right after a Wolf Grip it becomes a two-handed cross strike instead.
  components:
  - type: Action
    useDelay: 30
    itemIconStyle: BigAction
    icon:
      sprite: _CorvaxGoob/Interface/Actions/proper_kung_fu.rsi
      state: claw_whirlwind
  - type: TargetAction
    # Client-side hint only; the server checks the user's fist range.
    range: 1.5
    interactOnMiss: false
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - MobState
    event: !type:ClawWhirlwindActionEvent
      damage:
        types:
          Blunt: 10
      flipDistance: 0.9
      flipDuration: 0.5
      airDuration: 1
      landHold: 0.5
      launchHeight: 0.8
      spins: 2
      knockdownTime: 2
      markDuration: 2
      brainTraumaSeverity: 6
      impactEffect: ProperKungFuKneeBurst
      flipSound:
        path: /Audio/Effects/thudswoosh.ogg
      kneeSound:
        path: /Audio/Weapons/genhit2.ogg
      landSound:
        path: /Audio/Effects/thudswoosh.ogg
      # Wolf Grip synergy: two-handed cross strike instead of the throw.
      gripStrikeDamage:
        types:
          Blunt: 20
          Slash: 10
      gripLungDamageFraction: 0.4
      gripBreathBlockTime: 60
      gripKnockbackDistance: 8
      gripKnockbackSpeed: 10
      gripKnockdownTime: 10
      gripImpactEffect: ProperKungFuCrossSlash
      gripSound:
        path: /Audio/Weapons/genhit3.ogg

- type: entity
  parent: BaseAction
  id: ActionProperKungFuHammer
  name: Hammer
  description: One sweeping downward claw strike into the head of a target within fist reach (15 Blunt, eyes and brain lose 30 percent). The target is floored and can't get up for 5 seconds. A target that was already lying takes 50 Blunt to the head and falls asleep for 30 seconds. A target in critical condition has its head torn to pieces. Right after a Wolf Grip it deals 20 Blunt to the head and you backflip away, and a Wolf Dance within 2 seconds becomes an instant dash into the target.
  components:
  - type: Action
    useDelay: 20
    itemIconStyle: BigAction
    icon:
      sprite: _CorvaxGoob/Interface/Actions/proper_kung_fu.rsi
      state: hammer
  - type: TargetAction
    # Client-side hint only; the server checks the user's fist range.
    range: 1.5
    interactOnMiss: false
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - MobState
    event: !type:HammerActionEvent
      damage:
        types:
          Blunt: 15
      knockdownTime: 5
      eyeDamageFraction: 0.3
      brainDamageFraction: 0.3
      lyingDamage:
        types:
          Blunt: 50
      sleepTime: 30
      gripDamage:
        types:
          Blunt: 20
      backflipDistance: 1
      backflipDuration: 0.35
      danceWindow: 2
      impactEffect: ProperKungFuHammerStrike
      gripImpactEffect: ProperKungFuHammerUpStrike
      hitSound:
        path: /Audio/Weapons/genhit3.ogg
      gibSound:
        path: /Audio/Effects/gib1.ogg
      gibBloodSpill: 40
