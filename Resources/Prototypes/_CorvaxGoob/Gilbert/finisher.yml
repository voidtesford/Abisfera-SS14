# V3 "ground and pound" (gilbertfinisher <gilbert> <victim> 3), v10b rework. Authored in /workspace/gilbert/finisher/v3.py (lib10).
# Right-to-left buttstroke into the jaw spins the victim round (North view, then Turned: back to Gilbert) -> shot into the
# back of the knees (the leg damage lands here) drops it onto its knees -> he slings the shotgun (holsterAt), walks up
# behind it and plants his foot on its upper back -> rips off the right arm, then the left (real amputations when each
# thrown arm lands, with `hide`) -> draws a baton (visual prop), wrenches the head back by the hair and rams the baton
# into the mouth, the victim looking straight up -> takes the shotgun back (unholsterAt) and blows the head off: real
# Head amputation + `kill` on the same event (60 Blunt head + 40 Blunt chest, armor ignored) -> pulls the baton out of
# the stump, the corpse topples forward -> flicks and stows the baton, walks off. holdAlive keeps the victim from
# going crit / dead before the head shot.
- type: procAnimScene
  id: GilbertFinisherGroundPound
  length: 12.3
  requiredRoom: 3.2
  actors:
  - role: attacker
    face: {glow: true}
    expressions:
    - {t: 0, face: angry}
    - {t: 1.58, face: neutral}
    - {t: 3.15, face: angry}
    - {t: 6.3, face: neutral}
    - {t: 7, face: angry}
    - {t: 9.4, face: neutral}
    facing: 1
    # v13.2: the shotgun stays slung after the leg shots (the ending is the baton and a kick, no head shot).
    holsterHeldItems: true
    holsterAt: 1.82
    # v11: before anything, both hands are emptied with the real items (one quick reach each); they come back after.
    stowHands:
      keep: [{components: [Gun]}]
      rules:
      - {match: {prototypes: [TelescopicShieldShogkk, TelescopicShield]}, slots: [back, belt]}
      - {match: {prototypes: [TruncheonShogkk, Truncheon]}, slots: [belt, back]}
      - {match: {components: [Gun]}, slots: [suitstorage, back]}
    items:
    - {id: shotgun, match: {components: [Gun]}, wield: true}
    - {id: truncheon, match: {prototypes: [TruncheonShogkk, Truncheon]}, draw: 6.5, return: 10.42,
        previewSprite: Objects/Weapons/Melee/truncheon.rsi}
    smooth: true
    props:
    - {item: truncheon, itemRotation: -45, itemScale: 0.55, sprite: _CorvaxGoob/Effects/Gilbert/finisher_props.rsi, state: truncheon, start: 6.5, end: 7.25, part: ArmFarHand, front: true,
