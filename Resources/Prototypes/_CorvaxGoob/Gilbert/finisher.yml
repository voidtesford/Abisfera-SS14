# Gilbert's phase-1 finisher cutscenes (t265u): `procAnimScene` prototypes of the generic ProcAnim library (v11, see
# Resources/Prototypes/_CorvaxGoob/ProcAnim/README.md), actors `attacker` (Gilbert) and `victim`. Played by Gilbert's AI
# through GilbertFinisherSystem, the `gilbertfinisher` admin command or `procanim play <id> <attacker> <victim>`.
# Forward frame: +x = from Gilbert towards the victim, +y = up, rot = degrees, CCW positive when +x is east
# (Gilbert: a hanging arm/leg swung forward is +rot, his body pitching forward is -rot; the victim faces him,
# so for the victim it is the other way round). Part x/y are pixels (32 px = 1 tile), `move` is tiles relative
# to Gilbert's start position. Times are animation time: `hitStop` events freeze everything for a moment and
# push the rest of the timeline back.
# Arms and legs have two rigid segments: ArmNear/ArmFar (upper arm) about the shoulder and ArmNearLow/ArmFarLow
# (forearm + hand + glove, no wrist joint) about the elbow; LegNear/LegFar (thigh) about the hip and LegNearLow/
# LegFarLow (shin + shoe) about the knee - each relative to its parent segment (joints are measured from the body-part
# masks of the sprite; the arm poses are solved by a 2-bone IK on the hand centre). Joint limits are applied after the
# procedural layers: knees fold backwards only, elbows forwards only, shoulders -80..190 degrees
# (ProcAnimTimeline.ApplyJointLimits).
# HeldNear / HeldFar are the held items while still in the hands (until `holsterAt`), carried by the hands.
# `intro` seconds (anim time -intro..0) are played first only when the attacker holds something: the holster
# beat. `views` force a sprite direction for a while (North = back to the camera).
# On top of the keys: `walk` (procedural walk cycle driven by the distance moved), `idle` (breathing / weight
# shift while not walking) and `look` (head turns towards the other actor's head).
# Read by ProcAnimVisualsSystem (client), ProcAnimSystem (server) and the offline preview renderer
# (Tools/_CorvaxGoob/procanim/preview.py).
#
# Beats (anim time; hit-stops push real time back): [-0.6..0, only with something in the hands: Gilbert swings
# the shotgun up over his shoulder onto his back] 0.3 grabs the head - 0.6 pulls it down, victim struggles -
# 0.88 knee to the face - 0.9..1.6 victim reels back - 1.3..3.2 concussed: staggers, sways, head lolls, dizzy
# stars, tries to shake it off while Gilbert slowly walks up - 3.05 guard up (forearms in front of the face) -
# 3.25 shoulders grabbed - 3.72 headbutt - 4.25 falls on the back - 4.4..5.4 Gilbert walks to the head, victim
# covers the face - 6.12 stomp - 6.5 / 6.86 / 7.24 / 7.58 / 7.98 five more face stomps (the guard breaks after
# the second) - 8.22 Gilbert turns his back to the camera and steps round below the victim's head - 8.66 high
# side kick to the temple: the victim tumbles ~1.3 tiles away up-screen (flight 8.66..9.46, shortened by the
# server if a wall / no floor is in the way) and lies still - 9.3 turns back - 9.7..10.95 Gilbert walks off -
# 11.1 end.

