# Gilbert: hostile SHOGKK operative NPC. Names live in Locale/*/ss14-ru/prototypes/_corvaxgoob/entities/gilbert/gilbert.ftl

- type: npcFaction
  id: Gilbert
  hostile:
  - NanoTrasen
  - Syndicate
  - PirateFaction
  - Revolutionary
  - Heretic
  - Changeling
  - DevilFaction
  - Shadowling
  - Zombie
  - Xeno
  - SimpleHostile
  # No station fauna (PetsNT / Passive / SimpleNeutral / Mouse): he leaves pets alone and they leave him alone.
  - AllHostile
  - Dragon
  - Blob
  - Xenoborg
  - Wizard
  - Wraith
  - Lavafauna

- type: damageModifierSet
  id: GilbertModifiers
  coefficients:
    Cold: 0
    Radiation: 0

- type: startingGear
  id: GilbertGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitShogkk
    shoes: ClothingShoesBootsShogkk
    head: ClothingHeadHelmetShogkk
    mask: ClothingMaskGasSwat
    neck: ClothingNeckDogtagShogkk # v7: silver SHOGKK dog tag
    gloves: ClothingHandsGlovesCombat
    outerClothing: ClothingOuterArmorBulletproof
    belt: ClothingBeltShogkkWebbingFilled
    back: ClothingBackpackDuffelMilitaryShogkkFilled
    id: ShogkkIDCard
    pocket1: RadioHandheldShogkk
  inhand:
  - WeaponShotgunCombatShogkk

- type: entity
  parent: BaseMobHuman
  id: MobGilbert
  name: Gilbert
  description: ""
  components:
  - type: Gilbert
  - type: GilbertAbilities
  - type: GilbertAI
  - type: GilbertBerserk
  - type: GilbertRageAbilities
  - type: GilbertFractureImmune
  # Appearance (pale skin, black HumanHairBusiness3, red eyes) is applied by GilbertSystem on MapInit:
  # humanoidProfile prototypes overflow the stack in HumanoidCharacterProfile.Equals during prototype load.
  - type: HumanoidAppearance
    species: Human
    hideLayersOnEquip:
    - Hair
    - Snout
  - type: MobThresholds
    thresholds:
      0: Alive
      500: Dead
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: GilbertModifiers
    radiationDamageTypes: []
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 5000
      behaviors:
      - !type:GibBehavior { }
  # v9 (t258u): bare-handed prying: phase 1 forces (powered) airlocks he has no access to in 5 s (the time is set
  # by GilbertAISystem, bolts still stop him); the rage rips them open instantly, bolts or not (force on rage start).
  - type: Prying
    pryPowered: true
    instaPry: false
    speedModifier: 1
  # v9 (t258u): never slips on soap / spills, in both phases.
  - type: NoSlip
  # NPC: no combat-mode UI toggle sounds (the default paths are missing in this repo and would add linter errors).
  - type: CombatMode
    combatActivationSound: null
    combatDeactivationSound: null
  # Cold immunity: temperature damage ignores resistances, so the cold damage itself is removed.
  - type: Temperature
    heatDamageThreshold: 325
    coldDamageThreshold: 0
    currentTemperature: 310.15
    specificHeat: 42
    coldDamage: {}
    heatDamage:
      types:
        Heat: 1.5
  # Triple the default stamina pool (100): stun batons and shoves take three times as long to down him.
  # The animation / stun-modifier thresholds are scaled by the same factor.
  - type: Stamina
    critThreshold: 300
    animationThreshold: 150
    stunModifierThresholds:
      0: 1
      180: 0.7
      240: 0.5
  - type: BreathingImmunity
  - type: PressureImmunity
  - type: MeleeWeapon
    soundHit:
      collection: Punch
    angle: 30
    animation: WeaponArcFist
    attackRate: 1
    damage:
      types:
        Blunt: 15
  - type: MeleeThrowOnHit
    speed: 6
    distance: 1
  # Heavy stomp of the Death Squad magboots (FootstepHeavySuit). On the body, so it always plays:
  # the mover's own FootstepModifier wins over the shoes' and the tile's.
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepHeavySuit
      params:
        volume: 3
  # Red glow of his eyes in the dark. The offset turns with him, so the light spills just in front of his face
  # (rotation 0 faces south = local -Y). Switched off on death by GilbertSystem.
  - type: PointLight
    color: "#ff1a1a"
    radius: 2.2
    energy: 1.1
    softness: 1
    offset: 0, -0.2
    castShadows: false
  - type: NpcFactionMember
    factions:
    - Gilbert
  - type: Loadout
    prototypes:
    - GilbertGear
  - type: InputMover
  - type: MobMover

# Short white-red electric arc crackling around Gilbert's body while he spawns (purely visual, never shocks).
- type: entity
  id: GilbertSpawnArc
  name: electric arc
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _CorvaxGoob/Effects/gilbert_spawn_arc.rsi
    drawdepth: Effects
    noRot: false
    layers:
    - state: arc
      shader: unshaded
  - type: PointLight
    enabled: true
    color: "#ff4040"
    radius: 1.5
    energy: 1.2
    castShadows: false
  - type: TimedDespawn
    lifetime: 0.22
  - type: Tag
    tags:
    - HideContextMenu

