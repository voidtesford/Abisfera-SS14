# Army duffel bag
- type: entity
  parent: ClothingBackpackDuffelMilitary
  id: ClothingBackpackDuffelMilitaryShogkkFilled
  suffix: SHOGKK, Filled
  components:
  - type: StorageFill
    contents:
    - id: MedkitCombatFilled
      amount: 2
    - id: GrenadeShrapnel
      amount: 2
    - id: C4
      amount: 2
    - id: TruncheonShogkk
    - id: TelescopicShieldShogkk

# Gilbert's telescopic shield: indestructible (no Destructible thresholds, so neither blocking nor anything else
# ever breaks it; ordinary telescopic shields keep their normal break), with constant looping red energy crackle
# around and over it - folded or raised, on the floor and in hand.
- type: entity
  parent: TelescopicShield
  id: TelescopicShieldShogkk
  name: SHOGKK telescopic shield
  description: A telescopic riot shield humming with red energy. Nothing seems to leave a mark on it.
  components:
  - type: Destructible
    thresholds: []
  - type: GilbertCrackle
    sprite: _CorvaxGoob/Effects/Gilbert/crackle_shield.rsi
  - type: PointLight
    radius: 1.3
    energy: 0.7
    color: "#ff2a2a"
    castShadows: false

# Gilbert's truncheon: 50% armour penetration (the same DamageSpecifier.ArmorPenetration as the M8's 10%) and the
# same looping crackle (floor, in hand, on the belt).
- type: entity
  parent: Truncheon
  id: TruncheonShogkk
  name: SHOGKK truncheon
  description: A steel-studded baton crackling with red energy. It hits as if the armour wasn't there.
  components:
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 20
      armorPenetration: 0.5
  - type: GilbertCrackle
    sprite: _CorvaxGoob/Effects/Gilbert/crackle_truncheon.rsi
  - type: PointLight
    radius: 1.2
    energy: 0.6
    color: "#ff2a2a"
    castShadows: false

# v7: Gilbert's silver SHOGKK dog tag on a ball chain, worn on the neck (startingGear GilbertGear, slot neck).
# An ordinary neck item: it can be stripped, picked up and examined. Berserk only empties his hands, so it stays on.
- type: entity
  parent: ClothingNeckBase
  id: ClothingNeckDogtagShogkk
  name: SHOGKK dog tag
  description: Gilbert Berran, corporal. A tag issued to the Red Space assault operations group.
  components:
  - type: Sprite
    sprite: _CorvaxGoob/Clothing/Neck/Misc/shogkk_dogtag.rsi
  - type: Clothing
    sprite: _CorvaxGoob/Clothing/Neck/Misc/shogkk_dogtag.rsi
  - type: Item
    size: Tiny
    sprite: _CorvaxGoob/Clothing/Neck/Misc/shogkk_dogtag.rsi
