# Gilbert (SHOGKK operative) gear. Names/descriptions live in Locale/*/ss14-ru/prototypes/_corvaxgoob/gilbert/gear.ftl

# M8 combat shotgun: "Bojevic" with a Mosin-style bayonet. Alt-fire heavy attack is a bayonet thrust.
- type: entity
  parent: WeaponShotgunCombat
  id: WeaponShotgunCombatShogkk
  name: M8
  description: Heavy and reliable, it brings death and chaos to the enemy ranks.
  components:
  - type: Sprite
    sprite: _CorvaxGoob/Objects/Weapons/Guns/Shotguns/m8_shotgun.rsi
  - type: Clothing
    sprite: _CorvaxGoob/Objects/Weapons/Guns/Shotguns/m8_shotgun.rsi
  - type: MeleeWeapon
    wideAnimationRotation: -135
    animationRotation: -135
    damage:
      types:
        Piercing: 10
        Slash: 10
      armorPenetration: 0.1 # Gilbert: Энни-style 10% armour penetration on the bayonet too
    angle: 0
    animation: WeaponArcThrust
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  # Gilbert: every pellet ignores 10% of armour (same DamageSpecifier.ArmorPenetration as Энни's bullets).
  - type: GilbertArmorPenetration
    projectile: 0.1
  # Gilbert: constant looping red energy crackle around and over the gun (floor, hands, back, suit storage).
  - type: GilbertCrackle
    sprite: _CorvaxGoob/Effects/Gilbert/crackle_m8.rsi
  - type: PointLight
    radius: 1.3
    energy: 0.7
    color: "#ff2a2a"
    castShadows: false

# Webbing
- type: entity
  parent: ClothingBeltSecurityWebbing
  id: ClothingBeltShogkkWebbing
  name: SHOGKK operative webbing
  description: Assault team webbing.
  components:
  - type: Sprite
    sprite: _CorvaxGoob/Clothing/Belt/shogkk_webbing.rsi
  - type: Clothing
    sprite: _CorvaxGoob/Clothing/Belt/shogkk_webbing.rsi
  - type: Armor
    coverage:
    - Chest
    - Groin
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.8
        Heat: 0.8

- type: entity
  parent: ClothingBeltShogkkWebbing
  id: ClothingBeltShogkkWebbingFilled
  suffix: Filled
  components:
  - type: StorageFill
    contents:
    - id: MagazineBoxShotgunHighCaliber
      amount: 2
    - id: Handcuffs
      amount: 6

# Boots
- type: entity
  parent: ClothingShoesBootsJack
  id: ClothingShoesBootsShogkk
  name: SHOGKK combat boots
  description: Boots made specifically for marching into hell.
  components:
  - type: ClothingSlowOnDamageModifier
    modifier: 0.2
  - type: ModifyStandingUpTime
    multiplier: 0.25
  - type: Armor
    coverage:
    - Foot
    traumaDeductions:
      Dismemberment: 0.3
      OrganDamage: 0.3
      BoneDamage: 0.3
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.7
        Piercing: 0.7

# Uniform: the grey military jumpsuit, recoloured fully dark.
- type: entity
  parent: ClothingUniformBase
  id: ClothingUniformJumpsuitShogkk
  name: SHOGKK uniform
  description: Tough fabric, cool style, just the thing for infantry.
  components:
  - type: Sprite
    sprite: _NF/Clothing/Uniforms/Jumpsuit/military.rsi
    layers:
    - state: icon-base-bottom
      color: "#1c1c22"
    - state: icon-base-top-jumpsuit
      color: "#1c1c22"
    - state: icon-decor-contractor
      color: "#34343c"
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-base-bottom
        color: "#1c1c22"
      - state: inhand-left-base-top-jumpsuit
        color: "#1c1c22"
      - state: inhand-left-decor-contractor
        color: "#34343c"
      right:
      - state: inhand-right-base-bottom
        color: "#1c1c22"
      - state: inhand-right-base-top-jumpsuit
        color: "#1c1c22"
      - state: inhand-right-decor-contractor
        color: "#34343c"
  - type: Clothing
    sprite: _NF/Clothing/Uniforms/Jumpsuit/military.rsi
    clothingVisuals:
      jumpsuit:
      - state: equipped-base-bottom
        color: "#1c1c22"
      - state: equipped-base-top-jumpsuit-tac
        color: "#1c1c22"
      - state: equipped-decor-contractor
        color: "#34343c"

