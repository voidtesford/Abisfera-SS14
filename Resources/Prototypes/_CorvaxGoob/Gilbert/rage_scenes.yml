# Rage finisher (gilbertfinisher <gilbert> <victim> 4 | rage; his AI in phase 2): 0.62 palm strike to the chest -
# 0.62..1.25 the victim slides back two tiles on its feet - 1.4 Gilbert vanishes ("vanish": a faster, paler
# version of his spawn burst) and 1.8 reappears behind the victim ("appear"), facing its back - 2.1 / 2.3 drives one
# hand into the back at the chest and the other at the small of the back - 2.9..3.35 pulls the victim apart: the
# torso goes up with his hands, the pelvis and legs drop away (3.3 Groin amputated, kill) - 4.1 he drops the torso.
