# Rage finisher (gilbertfinisher <gilbert> <victim> 4 | rage; his AI in phase 2). v13.1:
# -0.6..0 (only with something in his hands) he slings the gun like the phase 1 finishers; it comes back after -
# 0.3 wind-up (weight back, shoulder cocked) - 0.62 palm strike to the chest, hips driving through - 0.62..1.25 the
# victim slides back two tiles on its feet - 1.4 Gilbert vanishes ("vanish": a faster, paler version of his spawn
# burst) and 1.8 reappears right behind the victim ("appear"), facing its back, drawn behind it - 1.92 cocks the
# arm - 2.1 drives the hand into the back at the chest, 2.3 the other into the small of the back (both stay buried) -
# 2.45..2.9 sinks into his legs, loading - 2.9..3.35 tears the victim apart: hips and shoulders thrown back, the
# torso goes up with his hands, the pelvis and legs drop away (3.3 Groin amputated, kill) - 3.6..3.85 twists the torso
# round to face him ("turns it": the victim's view flips) - 3.95..4.25 pulls it in, head drawn back - 4.32 headbutt,
# head to head (blood, flash, sound) - 4.75 lets go, 5.05 the torso hits the floor - recovers, 6.3 end.
- type: procAnimScene
  id: GilbertFinisherRage
