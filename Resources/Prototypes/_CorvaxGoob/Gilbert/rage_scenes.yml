# v13: Gilbert's phase-2 (rage) cutscenes, same conventions as finisher.yml (forward frame +x = Gilbert -> victim,
# part x/y in px, rot in degrees: for Gilbert an arm/leg swung forward is +rot and his body pitching forward is -rot;
# for the victim it is the other way round). Played by GilbertRageAbilitiesSystem / GilbertFinisherSystem.

# Leap (GilbertRageAbilitiesSystem.TryLeap): the dash knocked the victim down, Gilbert lands crouched at its feet.
# v13.1: the shotgun is slung on his back for the whole scene (holsterHeldItems), the stomps are foot-IK'd onto the
# chest / face with a wind-up (lean back, knee high, arms counter-swinging) and the stance knee absorbing the blow:
# 1.02 stomp on the chest (10 Shock) - 2.0 stomp on the head (10 Shock) - 2.7..2.95 bends at the knees and hips, both
# hands on the torso - 2.95..3.3 deadlifts it to his chest - 3.3..3.48 dips and pulls it back (loads the hips) -
# 3.62 drives forward and lets go ("release") - 3.62..4.25 the victim flies 5 tiles forward in an arc, tumbling once,
# lands (10 Blunt), bounces and slides (the flight is shortened by the server at walls; the server completes the
# 5 tiles with a real throw if anything is left).
