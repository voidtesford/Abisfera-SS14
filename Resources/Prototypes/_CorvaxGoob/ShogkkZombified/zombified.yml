- type: entity
  parent: BaseMobShogkkZombified
  id: MobShogkkZombified
  name: SHOGKK zombified
  suffix: Random job
  description: ""
  components:
  - type: ShogkkZombified
  - type: ShogkkZombifiedAI
  # Job picked at random, its outfit, sometimes (toolChance) a job tool in hand; random human of either sex with a random
  # Russian name and pale amber-red eyes (ShogkkZombifiedSystem).
  - type: ShogkkZombifiedGear
    toolChance: 0.15
    jobs:
    - id: assistant
      gear:
      - ShogkkZombifiedGearAssistant
      - ShogkkZombifiedGearAssistantGloves
      tools:
      - Crowbar
      - Wrench
    - id: engineer
      gear:
      - ShogkkZombifiedGearEngineerHardhat
      - ShogkkZombifiedGearEngineerVest
      - ShogkkZombifiedGearEngineerFull
      tools:
      - Wrench
      - Crowbar
    - id: scientist
      gear:
      - ShogkkZombifiedGearScientist
      - ShogkkZombifiedGearScientistGloves
      tools:
      - FireExtinguisher
      - Crowbar
    - id: medic
      gear:
      - ShogkkZombifiedGearMedic
      - ShogkkZombifiedGearMedicSurgeon
      - ShogkkZombifiedGearMedicParamedic
      tools:
      - Scalpel
    - id: security
      gear:
      - ShogkkZombifiedGearSecurity
      - ShogkkZombifiedGearSecurityNoHelmet
      tools:
      - Stunbaton
      - Truncheon
    - id: cargo
      gear:
      - ShogkkZombifiedGearCargo
      - ShogkkZombifiedGearSalvage
      tools:
      - Crowbar
      - Pickaxe
    - id: chef
      gear:
      - ShogkkZombifiedGearChef
      tools:
      - KitchenKnife
      - RollingPin
    - id: botanist
      gear:
      - ShogkkZombifiedGearBotanist
      tools:
      - HydroponicsToolHatchet
      - HydroponicsToolMiniHoe
    - id: janitor
      gear:
      - ShogkkZombifiedGearJanitor
      tools:
      - MopItem
  - type: HumanoidAppearance
    species: Human
  # NPC: no combat-mode UI toggle sounds (the default paths are missing in this repo and would add linter errors).
  - type: CombatMode
    combatActivationSound: null
    combatDeactivationSound: null
  # A faint pale amber-red glow of the eyes, dimmer than the operatives' (the eye layers are drawn by the client
  # visualizer). Off on death.
  - type: PointLight
    color: "#ff9a7a"
    radius: 1.2
    energy: 0.4
    softness: 1
    offset: 0, -0.2
    castShadows: false
  - type: NpcFactionMember
    factions:
    - ShogkkZombified
  - type: InputMover
  - type: MobMover

