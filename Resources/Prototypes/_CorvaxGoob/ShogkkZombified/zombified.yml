# Ordinary SHOGKK zombified: crew taken by the red space. Plain humans (man or woman, random Russian name) in what
# they wore at work, a dim pale amber-red glow in the eyes, no gun ever. They roam the place at random looking for
# victims (anyone alive and human-shaped who is neither an operative nor one of them: players, crew, Gilbert), chase
# and beat them with fists or, now and then, a job tool in hand, groan to call the others around and drift into loose
# hordes. Neutral to the SHOGKK operatives (and they to them), hostile to Gilbert both ways. No ghost role, no radio.
# Code: Content.Server/_CorvaxGoob/ShogkkOperative/ShogkkZombified*.cs.

- type: npcFaction
  id: ShogkkZombified
  friendly:
  - ShogkkOperative
  hostile:
  - Gilbert
  - NanoTrasen
  - Syndicate
  - PirateFaction
  - Revolutionary
  - Heretic
  - Changeling
  - DevilFaction
  - Shadowling
  - Zombie
  - Xeno
  - SimpleHostile
  - AllHostile
  - Dragon
  - Blob
  - Xenoborg
  - Wizard
  - Wraith
  - Lavafauna

