# Wolf Pack clone / ultimate shadow brain. The ProperKungFuSystem only writes the victim into the
# ProperKungFuCloneTarget key (and fires the art's skills itself). The first task of the branch turns it into the
# Target/TargetCoordinates keys as planning effects (like the stock UtilityOperator), so MoveTo/Melee always find them.
- type: htnCompound
  id: ProperKungFuCloneCompound
  branches:
    - preconditions:
      - !type:KeyExistsPrecondition
        key: ProperKungFuCloneTarget
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:ProperKungFuCloneTargetOperator
        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            shutdownState: PlanFinished
            pathfindInPlanning: true
            removeKeyOnFinish: false
            brakeMaxVelocity: null
            targetKey: TargetCoordinates
            pathfindKey: TargetPathfind
            rangeKey: MeleeRange
        - !type:HTNPrimitiveTask
          operator: !type:MeleeOperator
            targetKey: Target
          preconditions:
            - !type:KeyExistsPrecondition
              key: Target
            - !type:KeyExistsPrecondition
              key: TargetCoordinates
            - !type:TargetInRangePrecondition
              targetKey: Target
              rangeKey: MeleeRange
    - tasks:
        - !type:HTNCompoundTask
          task: IdleCompound
