- type: entity
  id: ProperKungFuShockwaveEffect
  name: wolf dance shockwave
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 0.8
  - type: Sprite
    drawdepth: Effects
    noRot: true
    layers:
    - shader: unshaded
      map: ["enum.EffectLayers.Unshaded"]
      sprite: _CorvaxGoob/Effects/wolf_dance_shockwave.rsi
      state: shockwave
  - type: EffectVisuals
  - type: Tag
    tags:
    - HideContextMenu
  - type: AnimationPlayer

- type: entity
  id: ProperKungFuDashAfterimage
  name: wolf dance afterimage
  categories: [ HideSpawnMenu ]
  components:
  - type: Trail
    lerpTime: 0.01
    frequency: 0.01
    maxParticleAmount: 1
    lifetime: 0.6
    alphaLerpAmount: 0.12
    color: "#FF5050C0"
    shader: unshaded
    spawnRemainingTrail: false
  - type: Transform
    noRot: true
  - type: Tag
    tags:
    - HideContextMenu
  - type: TimedDespawn
    lifetime: 1

# Proper Kung Fu fist arc: red wolf claw scratch, replaces WeaponArcFist (and the wide / miss arcs) while the art is known.
- type: entity
  id: WeaponArcProperKungFuClaw
  parent: WeaponArcStatic
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _CorvaxGoob/Effects/proper_kung_fu_claw.rsi
    state: claw_scratch
    drawdepth: Effects

# Claw Series finisher (double palm thrust): white-red impact flash on the target.
- type: entity
  id: ProperKungFuPalmFlash
  name: palm strike flash
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: Effects
    noRot: true
    sprite: Effects/arcs.rsi
    layers:
    - state: smash
      shader: unshaded
      color: "#FF2A2AD0"
      scale: 1.8, 1.8
    - state: smash
      shader: unshaded
      color: "#FFFFFFF0"
      scale: 1.1, 1.1
  - type: PointLight
    radius: 2
    energy: 2
    color: "#FF6060"
  - type: FadingTimedDespawn
    lifetime: 0.1
    fadeOutTime: 0.25
  - type: AnimationPlayer
  - type: Tag
    tags:
    - HideContextMenu

# Dust kicked up while the target slides back on its feet (Goob sprint dust, tinted white / red).
- type: entity
  parent: SmallSprintAnimation
  id: ProperKungFuDustPuffWhite
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: WallMountedItems
    sprite: _Goobstation/Effects/sprinting.rsi
    color: "#FFF4F4"
    layers:
    - map: [ "enum.SprintVisualLayers.Base" ]
      sprite: _Goobstation/Effects/sprinting.rsi
      state: sprint_cloud_small

- type: entity
  parent: SmallSprintAnimation
  id: ProperKungFuDustPuffRed
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: WallMountedItems
    sprite: _Goobstation/Effects/sprinting.rsi
    color: "#FF6A6A"
    layers:
    - map: [ "enum.SprintVisualLayers.Base" ]
      sprite: _Goobstation/Effects/sprinting.rsi
      state: sprint_cloud_small
