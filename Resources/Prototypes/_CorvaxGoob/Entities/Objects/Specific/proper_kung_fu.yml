# Admin spawn only for now: intentionally not added to any uplink, loot table or other spawner.
- type: entity
  parent: BaseItem
  id: ProperKungFuManual
  name: Proper Kung Fu manual
  description: A small crimson manual. The pages are full of drawings of a wolf-like fighter dashing at people and kicking them across the room.
  components:
  - type: Sprite
    sprite: _CorvaxGoob/Objects/Misc/proper_kung_fu_manual.rsi
    state: icon
  - type: Item
    size: Small
  - type: StaticPrice
    price: 3000
  - type: GrantProperKungFu

# Kunai summoned by the Proper Kung Fu "Kunai" action. Melee is a combat knife with 15 Slash.
# Thrown, it sticks like a throwing knife and pulls its summoner to where it lands, then vanishes.
- type: entity
  parent: BaseItem
  id: ProperKungFuKunai
  name: kunai
  description: A dark kunai with a red-wrapped grip and a ring pommel. It smells faintly of smoke.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _CorvaxGoob/Objects/Weapons/Melee/proper_kung_fu_kunai.rsi
    layers:
    - state: icon
      map: [ "base" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ProperKungFuKunaiVisuals.State:
        base:
          Idle: { state: icon }
          Thrown: { state: thrown }
          Embedded: { state: embedded }
  - type: Item
    size: Small
    sprite: _CorvaxGoob/Objects/Weapons/Melee/proper_kung_fu_kunai.rsi
  - type: Sharp
  - type: MeleeWeapon
    # Same swing as the combat knife.
    animationRotation: -135
    wideAnimationRotation: -135
    attackRate: 1.5
    damage:
      types:
        Slash: 15
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: EmbeddableProjectile
    sound: /Audio/Weapons/star_hit.ogg
    offset: -0.15,0.0
  - type: LandAtCursor
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 15
  - type: ThrowingAngle
    angle: 225
  - type: DisarmMalus
    malus: 0.225
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape
          radius: 0.01
          vertices:
          - -0.4,-0.2
          - -0.2,-0.4
          - 0.4,0.2
          - 0.2,0.4
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: ProperKungFuKunai

# CorvaxGoob-ProperKungFu v13: the Claw Mastery kunai. Splits into a fan of five when its summoner throws it; every
# kunai of the fan is deleted after it hits or lands (ProperKungFuSystem).
- type: entity
  parent: ProperKungFuKunai
  id: ProperKungFuFanKunai
  name: crimson kunai
  description: A kunai wreathed in crimson haze. It feels like several blades at once.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _CorvaxGoob/Objects/Weapons/Melee/proper_kung_fu_kunai.rsi
    color: "#ff9a9a"
    layers:
    - state: icon
      map: [ "base" ]
  - type: ProperKungFuFanKunai
